services:
  - type: web
    name: prepmate-ai-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENV
        value: production
      - key: MONGOURI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_FAST_MODEL
        value: ""
      - key: GROQ_MAX_TOKENS
        value: "4096"
      - key: GROQ_REASONING_EFFORT
        value: low
      - key: CLIENT_URL
        sync: false
